[package]
name = "sports-native"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "sports-native"
path = "src/main.rs"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "1ad9cf69a22c86e9803b257220eae8ee6456c9ce" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDictionary", "NSString", "NSURL", "NSObject", "NSValue", "NSError"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVAsset", "AVPlayer", "AVPlayerItem", "AVPlayerItemOutput", "AVMediaFormat", "objc2-core-foundation", "objc2-core-media", "objc2-core-video"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMTime"] }
objc2-core-video = { version = "0.3", features = ["CVPixelBufferIOSurface", "objc2-io-surface"] }
objc2-core-foundation = { version = "0.3", features = ["CFRunLoop", "CFDate"] }
objc2-io-surface = "0.3"

[profile.release]
debug = false
